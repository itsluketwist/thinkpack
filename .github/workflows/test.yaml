name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # testing job configuration and steps
  test:

    runs-on: ubuntu-latest

    environment:
      name: test

    strategy:
      matrix:
        # test on all versions supported (up to the newest)
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:

      - name: 1. Checkout the code...
        uses: actions/checkout@v4

      - name: 2. Configure Python version ${{ matrix.python-version }}...
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 3. Run the tests...
        run: uv run --group dev pytest

  # testing against the newest dependency versions (ignoring the lock file), so that
  # breaking changes in transformers or tokenizers are caught before users hit them
  test-latest:

    runs-on: ubuntu-latest

    environment:
      name: test

    steps:

      - name: 1. Checkout the code...
        uses: actions/checkout@v4

      - name: 2. Configure Python version 3.13...
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: 3. Run the tests with the latest dependencies...
        run: uv run --group dev --upgrade pytest
