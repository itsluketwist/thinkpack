# Package specification, as defined here:
# https://packaging.python.org/en/latest/specifications/pyproject-toml/#pyproject-toml-spec

[build-system]
# setuptools 77+ is needed for the spdx license expression in [project] below
requires = ["setuptools>=77", "setuptools-git-versioning<2"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "thinkpack"
dynamic = ["version"]
description = "A lightweight framework for reasoning-aware training, parsing, and evaluation of explicit reasoning language models."
readme = "README.md"
authors = [{ name = "Lukas Twist", email = "itsluketwist@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["thinkpack", "llm", "reasoning", "reasoning-collapse", "fine-tuning", "loss-masking"]
requires-python = ">=3.11"

dependencies = [
    "datasets",
    "jinja2",
    # transformers 5.3 to 5.12 load some tokenizers (e.g. DeepSeek-R1-Distill) incorrectly,
    # producing wrong token ids — https://github.com/huggingface/transformers/issues/45488
    "transformers>=4.57,!=5.3.*,!=5.4.*,!=5.5.*,!=5.6.*,!=5.7.*,!=5.8.*,!=5.9.*,!=5.10.*,!=5.11.*,!=5.12.*",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ty",
    "uv",
]

[project.scripts]
thinkpack = "thinkpack._cli:main"

[project.urls]
Homepage = "https://github.com/itsluketwist/thinkpack"

[tool.setuptools.package-data]
"thinkpack.data" = ["llms.txt"]

[tool.uv]
exclude-newer = "7 days"
